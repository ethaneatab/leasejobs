global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  # The Python processes run on the host (see docker-compose.yml for why).
  - job_name: api
    static_configs: [{targets: ["host.docker.internal:8910"]}]
  - job_name: workers
    static_configs: [{targets: ["host.docker.internal:8911", "host.docker.internal:8912", "host.docker.internal:8913"]}]
  - job_name: scheduler
    static_configs: [{targets: ["host.docker.internal:8916"]}]
  - job_name: integration
    static_configs: [{targets: ["host.docker.internal:8915"]}]
